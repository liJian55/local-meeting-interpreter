[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-meeting-interpreter"
version = "0.1.0"
description = "Private, on-device meeting interpreter"
requires-python = ">=3.11"
dependencies = [
    "av>=14,<16",
    "ctranslate2>=4.9,<5",
    "faster-whisper>=1.2,<2",
    "PyAudioWPatch>=0.2.12,<0.3; platform_system == 'Windows'",
    "PySide6-Essentials>=6.12,<7",
    "sentencepiece>=0.2.1,<0.3",
]

[project.scripts]
meeting-interpreter = "local_meeting_interpreter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_meeting_interpreter"]

